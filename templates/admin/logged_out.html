{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div style="text-align: center; padding: 50px 20px; max-width: 500px; margin: 40px auto; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
    <h2 style="color: #111827; margin-bottom: 12px;">{% translate "Logged out successfully" %}</h2>
    <p style="color: #6b7280; font-size: 15px; margin-bottom: 24px;">{% translate "You have been logged out. Redirecting to the website..." %}</p>
    <p>
        <a href="{{ FRONTEND_URL }}" style="display: inline-block; background: #f97316; color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px;">
            ← Return to QuickStay Website
        </a>
    </p>
</div>
<script>
    setTimeout(function() {
        window.location.href = "{{ FRONTEND_URL }}";
    }, 100);
</script>
{% endblock %}
